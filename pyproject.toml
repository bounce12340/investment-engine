[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-engine"
version = "0.1.0"
description = "Institutional Quant-Mental Hybrid Platform — triangulation valuation, kill-switches, and Obsidian-integrated weekly reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "yfinance>=0.2.40",
    "typer>=0.12.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0"]

[project.scripts]
investment-engine = "investment_engine.cli:app"

[tool.setuptools.packages.find]
include = ["investment_engine*"]

[tool.setuptools.package-data]
"investment_engine" = ["reports/templates/*.md.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
